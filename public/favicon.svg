<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="160" y1="120" x2="352" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Soft Ambient Glow Inner Circle -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" fill-opacity="0.08" />

  <!-- Shield / Vault Arc -->
  <path d="M256 80 L380 140 V260 C380 345 328 412 256 440 C184 412 132 345 132 260 V140 Z" fill="#ffffff" fill-opacity="0.15" />

  <!-- Golden Piggy / Coin Center -->
  <circle cx="256" cy="256" r="110" fill="url(#coinGrad)" filter="url(#shadow)" stroke="#fef9c3" stroke-width="8" />

  <!-- Indian Rupee / Currency Symbol Motif & Sparkle -->
  <path d="M216 195 H296 M216 220 H296 M216 195 H256 C272 195 284 205 284 220 C284 235 272 245 256 245 H216 L280 315" 
        stroke="#78350f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Modern Sparkles -->
  <path d="M380 100 L388 120 L408 128 L388 136 L380 156 L372 136 L352 128 L372 120 Z" fill="#fef08a" />
  <path d="M120 340 L126 354 L140 360 L126 366 L120 380 L114 366 L100 360 L114 354 Z" fill="#fef08a" />
</svg>